version: '3.8'

networks:
  radar_network:
    driver: bridge

volumes:
  clickhouse_data:
  clickhouse_logs:
  redis_data:

services:
  # 1. Almacenamiento Columnar y Motor Analítico Masivo
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: radar_clickhouse
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./docker/clickhouse/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    environment:
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-clickhouse_secure_pass_change_me}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-radar_db}
    expose:
      - "8123" # HTTP API interno
      - "9000" # Native TCP client interno
    networks:
      - radar_network
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # 2. Broker de Tareas y Memoria Caché
  redis:
    image: redis:7-alpine
    container_name: radar_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - radar_network
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  # 3. API Gateway & Orquestador (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: radar_backend
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-clickhouse_secure_pass_change_me}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-radar_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    expose:
      - "8000"
    depends_on:
      - clickhouse
      - redis
    networks:
      - radar_network
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G

  # 4. Pipeline Asíncrono e Inteligencia Artificial (Worker Celery + Beat)
  data_worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: radar_worker
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-clickhouse_secure_pass_change_me}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-radar_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SODA_APP_TOKEN=${SODA_APP_TOKEN}
    command: celery -A tasks worker --beat --loglevel=info -c 2
    depends_on:
      - redis
      - clickhouse
    networks:
      - radar_network
    restart: always
    deploy:
      resources:
        limits:
          memory: 1.5G

  # 5. Aplicación Web (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: radar_frontend
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    depends_on:
      - backend
    networks:
      - radar_network
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G

  # 6. Proxy Inverso Perimetral (Nginx)
  nginx:
    image: nginx:alpine
    container_name: radar_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - radar_network
    restart: always
