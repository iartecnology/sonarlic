name: CD Production Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Zero-Downtime Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/sonarIAR || cd /var/www/radar-licitaciones-saas
            git pull origin main
            
            # Compilación previa sin apagar contenedores activos
            docker compose build
            
            # Recreación suave de contenedores modificados
            docker compose up -d --remove-orphans
            
            # Limpieza de imágenes dangling para liberar espacio en el VPS
            docker image prune -f
